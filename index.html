<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1b2129;background:#f4f6f8}
  @keyframes gdxspin{to{transform:rotate(360deg)}}
  @keyframes gdxfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d2d8e0;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#b6bfca;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  input,textarea,button,select{font-family:inherit}
  textarea{resize:vertical}
</style>
<script src="genedex-data.js"></script>
</helmet>
<div style="height:100vh;width:100vw;overflow:hidden;background:#f4f6f8;color:#1b2129">
  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
    <div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;background:#ffffff">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:38px;height:38px;border-radius:9px;background:#0d9488;position:relative;box-shadow:0 4px 14px rgba(13,148,136,.3)">
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;font-family:'IBM Plex Mono',monospace">G</div>
          <div style="position:absolute;right:-5px;bottom:-5px;width:14px;height:14px;background:#d97706;border-radius:4px;border:2px solid #fff"></div>
        </div>
        <div style="font-size:26px;font-weight:600;letter-spacing:-.02em">Genedex</div>
      </div>
      <div style="width:30px;height:30px;border:3px solid #e6e9ed;border-top-color:#0d9488;border-radius:50%;animation:gdxspin .8s linear infinite"></div>
      <div style="color:#8b95a3;font-size:13px;letter-spacing:.01em">{{ loadMsg }}</div>
    </div>
  </sc-if>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
    {{ app }}
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}">
class Component extends DCLogic {
  state = { loading: true, ready: false, loadMsg: "Loading gene-list collection\u2026" };

  C = {
    bg:"#ffffff", canvas:"#f4f6f8", panel:"#fafbfc", panel2:"#f1f4f7",
    line:"#e6e9ed", line2:"#eef1f4",
    ink:"#1b2129", sub:"#586374", mut:"#8b95a3",
    ff:"#0d9488", ffBg:"#e4f3f1", ffLine:"#9fd4cc", ffDark:"#0b7d72",
    cf:"#d97706", cfBg:"#fbf0e1", cfLine:"#f0cd97", cfDark:"#b45f05",
    tf:"#4f46e5", tfBg:"#ecebfe", tfLine:"#c1bbf6", tfDark:"#3f37c9",
    act:"#1f2933", sig:"#15803d", sigBg:"#e7f4ec",
    blue:"#2563eb", blueBg:"#eef4ff",
  };

  async componentDidMount() {
    try {
      // The data layer (genedex-data.js) defines window.Genedex from a <helmet>
      // script; on a cold load the component can mount before that script has
      // run, so poll briefly instead of giving up immediately.
      let tries = 0;
      while (!window.Genedex && tries++ < 240) { await new Promise(r => setTimeout(r, 25)); }
      if (!window.Genedex) { this.setState({ loadMsg: "Data layer missing" }); return; }
      this.setState({ loadMsg: "Building gene memberships & indices\u2026" });
      await window.Genedex.ready;
      // Wait until the indices the UI reads are actually built before showing
      // the app — prevents a transient "reading 'length' of undefined" crash.
      let g2 = 0;
      while ((!window.Genedex.lists || !window.Genedex.universe || !window.Genedex.ffFacets || !window.Genedex.cfFacets || !window.Genedex.tissues || !window.Genedex.facetMeta) && g2++ < 240) { await new Promise(r => setTimeout(r, 25)); }
      this.G = window.Genedex;
      setTimeout(() => this.setState({ loading: false, ready: true }), 120);
    } catch (e) {
      this.setState({ loadMsg: "Error: " + (e && e.message) });
    }
  }

  // ---------- generic helpers ----------
  CLUST = ["#0d9488", "#d97706", "#2563eb", "#7c3aed", "#db2777", "#0891b2", "#65a30d", "#dc2626"];
  facetColor(type) { return type === "ff" ? this.C.ff : type === "tf" ? this.C.tf : this.C.cf; }

  renderVals() {
    return {
      loading: this.state.loading,
      ready: this.state.ready,
      loadMsg: this.state.loadMsg,
      app: this.state.ready ? React.createElement(this.App) : null,
    };
  }

  // =====================================================================
  //  ROOT APP
  // =====================================================================
  App = () => {
    const h = React.createElement;
    const { useState, useMemo, useCallback } = React;
    const C = this.C, G = window.Genedex;

    const [tab, setTab] = useState("workbench");
    const [wbTab, setWbTab] = useState("search");
    const [sessionLists, setSessionLists] = useState([]);
    const [legendOpen, setLegendOpen] = useState(false);
    const [aiOpen, setAiOpen] = useState(false);
    const [devMode, setDevMode] = useState(() => { try { return localStorage.getItem("gdx_dev") === "1" || /dev/.test(location.hash); } catch (e) { return false; } });
    const [devOpen, setDevOpen] = useState(false);
    React.useEffect(() => { const onKey = (e) => { if (e.altKey && e.shiftKey && (e.key === "D" || e.key === "d")) { setDevMode(m => { const n = !m; try { localStorage.setItem("gdx_dev", n ? "1" : "0"); } catch (_) {} return n; }); setDevOpen(true); } }; window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey); }, []);

    // ---- shared workbench state ----
    const DEFAULT = "APOE\nAPP\nMAPT\nTREM2\nBIN1\nCLU\nPSEN1\nGFAP\nAQP4\nC1QA\nCX3CR1\nSNAP25\nBDNF\nNLRP3\nSPP1\nSORL1\nPICALM\nABCA7";
    const [searchInput, setSearchInput] = useState(DEFAULT);
    const [searchRes, setSearchRes] = useState(null);
    const [searchOpts, setSearchOpts] = useState({ dir: "All", fdr: 0.05, facet: "", sort: "fdr" });
    const [fpInput, setFpInput] = useState(DEFAULT);
    const [fpRes, setFpRes] = useState(null);
    const [fpOpts, setFpOpts] = useState({ dir: "All", mode: "count", unit: "study", tissues: [], types: [], contrasts: [], facetClass: "both", cellTypes: [], funcFacets: [], tissueFacets: [], restrictFf: [], restrictCf: [], rowOrder: "breadth", cluster: false });
    const [ctOpts, setCtOpts] = useState({ minCooccurrence: 1, nPermutations: 1000, fdrAlpha: 0.05, facetTypes: { ff: true, cf: true }, minFacetOccurrence: 1 });
    const [ctInput, setCtInput] = useState("APOE");
    const [ctRes, setCtRes] = useState(null);
    const [ctBusy, setCtBusy] = useState(false);
    const [ctProgress, setCtProgress] = useState(null);
    const [ctError, setCtError] = useState(null);
    const [gmInput, setGmInput] = useState("APOE");
    const [gmRes, setGmRes] = useState(null);
    const [gmOpts, setGmOpts] = useState({ maxCandidates: 150, minCooccurrence: 2, k: 8, minSim: 0.05, resolution: 1, minModuleSize: 3, testSignificance: false, nPermutations: 200 });
    const [gmBusy, setGmBusy] = useState(false);
    const [gmProgress, setGmProgress] = useState(null);
    const [gmError, setGmError] = useState(null);

    const runSearch = useCallback((text, opts) => {
      const genes = G.compute.norm((text || "").split(/[\s,;]+/));
      const res = G.compute.enrich(genes, { dir: opts.dir });
      setSearchRes(res);
    }, []);
    const runFingerprint = useCallback((text, opts) => {
      const genes = G.compute.norm((text || "").split(/[\s,;]+/));
      setFpRes(G.compute.fingerprint(genes, { dir: opts.dir, unit: opts.unit, tissues: opts.tissues, types: opts.types, contrasts: opts.contrasts, restrictFf: opts.restrictFf, restrictCf: opts.restrictCf }));
    }, []);
    const runCotravel = useCallback(async (gene, opts) => {
      setCtBusy(true); setCtError(null); setCtProgress({ phase: "starting", frac: 0 });
      try {
        const res = await G.compute.cotravelTest(gene, opts, p => setCtProgress(p));
        setCtRes(res);
      } catch (e) {
        setCtError(e.message || String(e)); setCtRes(null);
      } finally {
        setCtBusy(false); setCtProgress(null);
      }
    }, []);


    const runModules = useCallback(async (genes, opts) => {
      setGmBusy(true); setGmError(null); setGmProgress({ phase: "starting", frac: 0 });
      try {
        const o = { ...opts, nPermutations: opts.testSignificance ? (opts.nPermutations || 200) : 0 };
        setGmRes(await G.compute.geneModules(genes, o, pr => setGmProgress(pr)));
      } catch (e) {
        setGmError(e.message || String(e)); setGmRes(null);
      } finally {
        setGmBusy(false); setGmProgress(null);
      }
    }, []);

    // run defaults once
    React.useEffect(() => { runSearch(DEFAULT, searchOpts); runFingerprint(DEFAULT, fpOpts); }, []);

    const pushToFingerprint = (genes) => { setFpInput(genes.join("\n")); setFpRes(G.compute.fingerprint(genes, { dir: fpOpts.dir, unit: fpOpts.unit, tissues: fpOpts.tissues, types: fpOpts.types, contrasts: fpOpts.contrasts, restrictFf: fpOpts.restrictFf, restrictCf: fpOpts.restrictCf })); setTab("workbench"); setWbTab("fingerprint"); };
    const pushToCotravel = (genes) => { if (!genes || !genes.length) return; const q = genes.join(", "); setCtInput(q); runCotravel(q, ctOpts); setTab("workbench"); setWbTab("cotravel"); };
    const pushToModules = (genes) => { if (!genes || !genes.length) return; const q = genes.join(", "); setGmInput(q); runModules(q, gmOpts); setTab("workbench"); setWbTab("modules"); };
    const saveList = (name, genes) => setSessionLists(l => [...l.filter(x => x.name.toLowerCase() !== name.toLowerCase()), { name, genes }]);

    // assistant context summary
    const aiContext = useMemo(() => {
      let c = "Active tab: " + tab + ".";
      if (tab === "workbench") {
        c += " Workbench view: " + wbTab + ".";
        if (wbTab === "search" && searchRes) {
          const sig = searchRes.rows.filter(r => r.fdr < 0.05).length;
          c += " Gene search: " + searchRes.nInput + " input genes vs " + G.lists.length + " curated lists; " + searchRes.rows.length + " lists have overlap, " + sig + " significant at FDR<0.05. Top hits: " + searchRes.rows.slice(0, 6).map(r => r.name + " (overlap " + r.nOverlap + ", FDR " + r.fdr.toExponential(1) + ", facets: " + [...r.ff, ...r.cf].join("/") + ")").join("; ") + ".";
        }
        if (wbTab === "fingerprint" && fpRes) {
          c += " Fingerprint of " + fpRes.rows.length + " genes across " + fpRes.ffCols.length + " functional + " + fpRes.cfCols.length + " cellular + " + (fpRes.tfCols || []).length + " tissue facets. Broadest genes: " + fpRes.rows.slice(0, 6).map(r => r.gene + " (breadth " + r.breadth + ")").join(", ") + ".";
        }
        if (wbTab === "modules" && gmRes) {
          c += " Gene modules for " + gmRes.gene + ": " + gmRes.nNodes + " co-occurring genes clustered into " + gmRes.modules.length + " modules (Louvain on a kNN Jaccard graph, modularity Q=" + gmRes.modularity.toFixed(3) + "). " + (gmRes.perm ? "Module tightness tested against a degree-preserving curveball null over " + gmRes.perm.nPermutations + " permutations; " + gmRes.perm.nSignificant + " of " + gmRes.modules.length + " modules pass BH q<=" + gmRes.perm.fdrAlpha + ". " : "No significance test was run \u2014 cohesion and Q are descriptive only. ") + gmRes.modules.slice(0, 5).map(m => "Module " + m.id + " (" + m.size + " genes, cohesion " + m.cohesion.toFixed(3) + (m.p != null ? ", p=" + m.p.toFixed(4) + ", q=" + m.q.toFixed(4) : "") + "): " + m.members.slice(0, 8).map(x => x.gene).join(", ") + "; facets " + m.ff.concat(m.cf).slice(0, 3).map(f => f.facet).join(", ")).join(" | ") + ".";
        }
        if (wbTab === "cotravel" && ctRes) {
          c += " Co-travel test for " + ctRes.gene + " (present in " + ctRes.queryDegree + "/" + ctRes.nLists + " curated lists): " + ctRes.nGenesTested + " genes tested against a degree-preserving null (curveball, " + ctRes.nPermutations + " permutations), " + ctRes.nSignificant + " significant co-travellers at FDR<" + ctRes.fdrAlpha + ". Top hits: " + ctRes.rows.slice(0, 6).map(r => r.gene + " (obs " + r.observed + " vs expected " + r.expected.toFixed(1) + ", q=" + r.qValue.toExponential(1) + ")").join("; ") + ".";
        }
      }
      return c;
    }, [tab, wbTab, searchRes, fpRes, ctRes, ctOpts, gmRes]);

    const suggestion = (() => {
      if (tab === "workbench" && wbTab === "search") return "Interpret my enrichment results \u2014 which facets are most significant?";
      if (tab === "workbench" && wbTab === "fingerprint") return "Which of my genes are most pleiotropic across facets, and what does that imply?";
      if (tab === "workbench" && wbTab === "cotravel") return "Why does the null model need to preserve gene degree, not just list size?";
      if (tab === "workbench" && wbTab === "modules") return "What distinguishes these modules biologically, and is the modularity high enough to trust them?";
      if (tab === "network") return "Which facet pairs share the most genes and why might that be?";
      if (tab === "similarity") return "Which gene lists are most correlated with my anchor list, and what unifies them?";
      return "What is Genedex and how should I use it?";
    })();

    const shared = { C, G, h, tab, setTab, wbTab, setWbTab, sessionLists, saveList,
      searchInput, setSearchInput, searchRes, setSearchRes, searchOpts, setSearchOpts, runSearch,
      fpInput, setFpInput, fpRes, fpOpts, setFpOpts, runFingerprint,
      ctInput, setCtInput, ctRes, ctOpts, setCtOpts, runCotravel, ctBusy, ctProgress, ctError,
      gmInput, setGmInput, gmRes, gmOpts, setGmOpts, runModules, gmBusy, gmProgress, gmError,
      pushToFingerprint, pushToCotravel, pushToModules, setLegendOpen };

    return h("div", { style: { height: "100vh", display: "flex", flexDirection: "column", background: C.canvas } },
      h(this.NavBar, { key: "nav-" + tab, ...shared, legendOpen, setLegendOpen, aiOpen, setAiOpen, devMode, setDevOpen }),
      h("div", { style: { flex: 1, minHeight: 0, position: "relative" } },
        tab === "network" ? h(this.NetworkModule, { key: "network", ...shared })
          : tab === "similarity" ? h(this.SimilarityModule, { key: "similarity", ...shared })
          : h(this.Workbench, { key: "workbench", ...shared }),
      ),
      legendOpen && h(this.Legend, { C, G, h, onClose: () => setLegendOpen(false) }),
      devOpen && h(this.DevPanel, { C, h, onClose: () => setDevOpen(false) }),
      h(this.AssistantDock, { C, h, open: aiOpen, setOpen: setAiOpen, context: aiContext, suggestion, tabName: tab }),
    );
  };

  // =====================================================================
  //  NAV BAR
  // =====================================================================
  NavBar = (p) => {
    const h = React.createElement, C = this.C, G = window.Genedex;
    const tabs = [["workbench", "Gene Workbench"], ["network", "Facets Network"], ["similarity", "Similarity Matrix"]];
    const tabBtn = ([id, label]) => h("button", {
      key: id, onClick: () => p.setTab(id),
      style: { border: "none", background: p.tab === id ? C.bg : "transparent", color: p.tab === id ? C.ink : C.sub,
        padding: "8px 16px", borderRadius: 8, fontSize: 13.5, fontWeight: p.tab === id ? 600 : 500, cursor: "pointer",
        boxShadow: p.tab === id ? "0 1px 3px rgba(20,30,50,.10)" : "none", transition: "all .12s" },
    }, label);
    return h("header", { style: { display: "flex", alignItems: "center", gap: 18, padding: "0 20px", height: 56,
      background: C.bg, borderBottom: "1px solid " + C.line, flex: "0 0 auto", zIndex: 20 } },
      // logo
      h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
        h("div", { style: { width: 30, height: 30, borderRadius: 8, background: C.ff, position: "relative" } },
          h("div", { style: { position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 700, fontSize: 16, fontFamily: "'IBM Plex Mono',monospace" } }, "G"),
          h("div", { style: { position: "absolute", right: -4, bottom: -4, width: 11, height: 11, background: C.cf, borderRadius: 3, border: "2px solid #fff" } })),
        h("div", { style: { fontSize: 18, fontWeight: 600, letterSpacing: "-.02em" } }, "Genedex"),
        h("div", { style: { fontSize: 10.5, color: C.mut, fontWeight: 500, letterSpacing: ".04em", textTransform: "uppercase", marginTop: 2 } }, "AD signature engine"),
      ),
      // tabs
      h("nav", { style: { display: "flex", gap: 4, background: C.panel2, padding: 4, borderRadius: 10, marginLeft: 8 } }, tabs.map(tabBtn)),
      h("div", { style: { flex: 1 } }),
      // stats
      h("div", { style: { display: "flex", alignItems: "center", gap: 16, fontSize: 12, color: C.sub } },
        h("div", null, h("b", { style: { color: C.ink, fontFamily: "'IBM Plex Mono',monospace" } }, G.lists.length.toLocaleString()), " lists"),
        h("div", null, h("b", { style: { color: C.ink, fontFamily: "'IBM Plex Mono',monospace" } }, G.universe.length.toLocaleString()), " genes"),
        h("div", { style: { display: "flex", gap: 6 } },
          h("span", { style: { color: C.ff, fontWeight: 600 } }, G.ffFacets.length + " FF"),
          h("span", { style: { color: C.cf, fontWeight: 600 } }, G.cfFacets.length + " CF"),
          h("span", { style: { color: C.tf, fontWeight: 600 } }, (G.tfFacets || []).length + " TS"))),
      window.Genedex.synthetic && h("div", { title: "Gene memberships are placeholder/synthetic. Upload the per-list .txt files to load real gene members.", style: { display: "flex", alignItems: "center", gap: 5, background: C.cfBg, color: C.cfDark, border: "1px solid " + C.cfLine, borderRadius: 20, padding: "3px 9px", fontSize: 10.5, fontWeight: 600, letterSpacing: ".02em", cursor: "help" } }, h("span", { style: { width: 6, height: 6, borderRadius: "50%", background: C.cf } }), "DEMO DATA"),
      h("div", { style: { width: 1, height: 24, background: C.line } }),
      // dev data loader (developers only)
      p.devMode && h("button", { onClick: () => p.setDevOpen(true), title: "Developer: load real gene-list data (Alt+Shift+D)",
        style: { display: "flex", alignItems: "center", gap: 6, border: "1px solid " + C.line, background: C.panel, color: C.sub, borderRadius: 8, padding: "7px 11px", fontSize: 12.5, fontWeight: 500, cursor: "pointer" } },
        h("span", { style: { fontSize: 13 } }, "\u2699"), "Data"),
      // my lists
      h("button", { onClick: () => p.setLegendOpen(true), title: "Facet taxonomy",
        style: { border: "1px solid " + C.line, background: C.bg, color: C.sub, borderRadius: 8, padding: "7px 12px", fontSize: 12.5, fontWeight: 500, cursor: "pointer" } }, "Facet legend"),
      h("div", { style: { display: "flex", alignItems: "center", gap: 7, border: "1px solid " + C.line, borderRadius: 8, padding: "6px 11px", fontSize: 12.5, color: C.sub } },
        h("span", null, "My Lists"),
        h("span", { style: { background: p.sessionLists.length ? C.ff : C.panel2, color: p.sessionLists.length ? "#fff" : C.mut, borderRadius: 20, minWidth: 18, height: 18, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 600, padding: "0 5px" } }, p.sessionLists.length)),
    );
  };

  // ---------- shared small UI ----------
  FacetChip = ({ name, type, count, onClick }) => {
    const h = React.createElement, C = this.C;
    const ff = type === "ff", tf = type === "tf";
    return h("span", { onClick, title: (ff ? "Functional" : tf ? "Tissue" : "Cellular") + " facet" + (count != null ? " \u00b7 " + count + " lists" : ""),
      style: { display: "inline-flex", alignItems: "center", gap: 5, background: ff ? C.ffBg : tf ? C.tfBg : C.cfBg,
        color: ff ? C.ffDark : tf ? C.tfDark : C.cfDark, border: "1px solid " + (ff ? C.ffLine : tf ? C.tfLine : C.cfLine),
        borderRadius: 6, padding: "2px 7px", fontSize: 11, fontWeight: 500, whiteSpace: "nowrap", cursor: onClick ? "pointer" : "default", lineHeight: 1.5 } },
      h("span", { style: { width: 5, height: 5, borderRadius: ff ? "50%" : tf ? 2 : 1, background: ff ? C.ff : tf ? C.tf : C.cf, transform: ff || tf ? "none" : "rotate(45deg)", flex: "0 0 auto" } }),
      name);
  };

  Seg = ({ value, onChange, options, accent }) => {
    const h = React.createElement, C = this.C;
    return h("div", { style: { display: "inline-flex", flexWrap: "wrap", background: C.panel2, borderRadius: 8, padding: 3, gap: 2 } },
      options.map(o => { const v = o.v != null ? o.v : o; const l = o.l != null ? o.l : o;
        const on = value === v;
        return h("button", { key: v, onClick: () => onChange(v),
          style: { border: "none", background: on ? C.bg : "transparent", color: on ? (accent || C.ink) : C.sub,
            padding: "5px 11px", borderRadius: 6, fontSize: 12, fontWeight: on ? 600 : 500, cursor: "pointer",
            boxShadow: on ? "0 1px 2px rgba(20,30,50,.10)" : "none" } }, l); }));
  };

  // =====================================================================
  //  WORKBENCH (Search + Fingerprint + Co-travel)
  // =====================================================================
  Workbench = (p) => {
    const h = React.createElement, C = this.C, G = window.Genedex;
    const { useState, useRef } = React;
    const [expanded, setExpanded] = useState(null);
    const [cellDrawer, setCellDrawer] = useState(null);
    const [openList, setOpenList] = useState(null);
    const metaByGl = React.useMemo(() => { const m = {}; G.lists.forEach(l => m[l.gl] = l); return m; }, []);
    const [ctSel, setCtSel] = useState(null);
    const [ctColorMode, setCtColorMode] = useState("plain");
    const [ctView, setCtView] = useState("graph");
    const [gmOpen, setGmOpen] = useState(null);
    const [toast, setToast] = useState("");
    const fileRef = useRef(null);
