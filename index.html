<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}">
class Component extends DCLogic {
  state = { loading: true, ready: false, loadMsg: "Loading gene-list collection\u2026" };

  C = {
    bg:"#ffffff", canvas:"#f4f6f8", panel:"#fafbfc", panel2:"#f1f4f7",
    line:"#e6e9ed", line2:"#eef1f4",
    ink:"#1b2129", sub:"#586374", mut:"#616c7b",
    ff:"#0b8177", ffBg:"#e4f3f1", ffLine:"#9fd4cc", ffDark:"#0a7469",
    cf:"#9d5604", cfBg:"#fbf0e1", cfLine:"#f0cd97", cfDark:"#a05504",
    tf:"#4f46e5", tfBg:"#ecebfe", tfLine:"#c1bbf6", tfDark:"#3f37c9",
    act:"#1f2933", sig:"#15803d", sigBg:"#e7f4ec",
    blue:"#2563eb", blueBg:"#eef4ff",
  };

  async componentDidMount() {
    try {
      // The data layer (genedex-data.js) defines window.Genedex from a <helmet>
      // script; on a cold load the component can mount before that script has
      // run, so poll briefly instead of giving up immediately.
      let tries = 0;
      while (!window.Genedex && tries++ < 240) { await new Promise(r => setTimeout(r, 25)); }
      if (!window.Genedex) { this.setState({ loadMsg: "Data layer missing" }); return; }
      this.setState({ loadMsg: "Building gene memberships & indices\u2026" });
      await window.Genedex.ready;
      // Wait until the indices the UI reads are actually built before showing
      // the app — prevents a transient "reading 'length' of undefined" crash.
      let g2 = 0;
      while ((!window.Genedex.lists || !window.Genedex.universe || !window.Genedex.ffFacets || !window.Genedex.cfFacets || !window.Genedex.tissues || !window.Genedex.facetMeta) && g2++ < 240) { await new Promise(r => setTimeout(r, 25)); }
      this.G = window.Genedex;
      setTimeout(() => this.setState({ loading: false, ready: true }), 120);
    } catch (e) {
      this.setState({ loadMsg: "Error: " + (e && e.message) });
    }
  }

  // ---------- generic helpers ----------
  CLUST = ["#0b8177", "#9d5604", "#2563eb", "#7c3aed", "#db2777", "#0891b2", "#65a30d", "#dc2626"];
  facetColor(type) { return type === "ff" ? this.C.ff : type === "tf" ? this.C.tf : this.C.cf; }
  pressable(onClick) {
    if (!onClick) return {};
    return {
      role: "button",
      tabIndex: 0,
      onClick,
      onKeyDown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(e); } },
    };
  }

  renderVals() {
    return {
      loading: this.state.loading,
      ready: this.state.ready,
      loadMsg: this.state.loadMsg,
      app: this.state.ready ? React.createElement(this.App) : null,
    };
  }

  // =====================================================================
  //  ROOT APP
  // =====================================================================
  App = () => {
    const h = React.createElement;
    const { useState, useMemo, useCallback } = React;
    const C = this.C, G = window.Genedex;
    const readUrlState = () => {
      try {
        const q = new URLSearchParams(window.location.search);
        const tabRaw = (q.get("tab") || "home").toLowerCase();
        const viewRaw = (q.get("view") || "").toLowerCase();
        const tabsOk = { home: "home", workbench: "workbench", search: "workbench", fingerprint: "workbench", contexts: "workbench", context: "workbench", download: "download", docs: "docs", about: "about" };
        const viewsOk = { search: "search", fingerprint: "fingerprint", contexts: "contexts", context: "contexts", similarity: "similarity" };
        const dirMap = { all: "All", up: "Up", down: "Down" };
        const genes = (q.get("genes") || "").split(/[,\s;]+/).map(s => s.trim()).filter(Boolean);
        const fdrRaw = q.get("fdr");
        const fdr = fdrRaw != null && fdrRaw !== "" && !isNaN(+fdrRaw) ? Math.min(1, Math.max(0, +fdrRaw)) : null;
        const dir = dirMap[String(q.get("direction") || q.get("dir") || "all").toLowerCase()] || "All";
        const view = viewsOk[viewRaw] || (tabRaw === "fingerprint" ? "fingerprint" : (tabRaw === "contexts" || tabRaw === "context") ? "contexts" : "search");
        let tab = tabsOk[tabRaw] || "home";
        if (!q.get("tab") && (viewRaw === "fingerprint" || viewRaw === "search" || viewRaw === "contexts" || viewRaw === "context")) tab = "workbench";
        return { tab, view, geneText: genes.join("\n"), fdr, dir, facet: q.get("facets") || q.get("facet") || "" };
      } catch (e) {
        return { tab: "home", view: "search", geneText: "", fdr: null, dir: "All", facet: "" };
      }
    };
    const writeUrlState = (s) => {
      try {
        const q = new URLSearchParams();
        if (s.tab && s.tab !== "home") q.set("tab", s.tab);
        if (s.tab === "workbench" && s.view && s.view !== "search") q.set("view", s.view);
        const genes = G.compute.norm(String(s.genes || "").split(/[\s,;]+/));
        if (genes.length) q.set("genes", genes.join(","));
        if (s.fdr != null && Number(s.fdr) !== 0.05) q.set("fdr", String(s.fdr));
        if (s.dir && s.dir !== "All") q.set("direction", String(s.dir).toLowerCase());
        if (s.facet) q.set("facets", s.facet);
        const qs = q.toString();
        const next = window.location.pathname + (qs ? "?" + qs : "") + window.location.hash;
        const cur = window.location.pathname + window.location.search + window.location.hash;
        if (next !== cur) history.replaceState(null, "", next);
      } catch (e) {}
    };
    const url0 = readUrlState();

    const [tab, setTab] = useState(() => (url0.tab && url0.tab !== "home") ? url0.tab : ((url0.geneText || url0.view === "fingerprint" || url0.view === "contexts") ? "workbench" : "home"));
    const [wbTab, setWbTab] = useState(() => url0.view === "fingerprint" ? "fingerprint" : url0.view === "contexts" ? "contexts" : url0.view === "similarity" ? "similarity" : "search");
    const [sessionLists, setSessionLists] = useState([]);
    const [legendOpen, setLegendOpen] = useState(false);
    const [devMode, setDevMode] = useState(() => { try { return localStorage.getItem("gdx_dev") === "1" || /dev/.test(location.hash); } catch (e) { return false; } });
    const [devOpen, setDevOpen] = useState(false);
    React.useEffect(() => { const onKey = (e) => { if (e.altKey && e.shiftKey && (e.key === "D" || e.key === "d")) { setDevMode(m => { const n = !m; try { localStorage.setItem("gdx_dev", n ? "1" : "0"); } catch (_) {} return n; }); setDevOpen(true); } }; window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey); }, []);

    // ---- shared workbench state ----
    const DEFAULT = "APOE\nAPP\nMAPT\nTREM2\nBIN1\nCLU\nPSEN1\nGFAP\nAQP4\nC1QA\nCX3CR1\nSNAP25\nBDNF\nNLRP3\nSPP1\nSORL1\nPICALM\nABCA7";
    const [wbGenes, setWbGenes] = useState(url0.geneText);
    const searchInput = wbGenes, setSearchInput = setWbGenes;
    const fpInput = wbGenes, setFpInput = setWbGenes;
    const ctxInput = wbGenes, setCtxInput = setWbGenes;
    const [searchRes, setSearchRes] = useState(null);
    const [searchOpts, setSearchOpts] = useState({ dir: url0.dir, fdr: url0.fdr != null ? url0.fdr : 1, facet: url0.facet, sort: "fdr", sortDir: "asc" });
    const [fpRes, setFpRes] = useState(null);
    const [fpOpts, setFpOpts] = useState({ dir: "All", mode: "count", unit: "study", tissues: [], types: [], contrasts: [], facetClass: "both", showSig: false, cellTypes: [], funcFacets: [], tissueFacets: [], restrictFf: [], restrictCf: [], rowOrder: "breadth", cluster: false });
    const [ctxRes, setCtxRes] = useState(null);
    const [ctxOpts, setCtxOpts] = useState({ process: "", minStudies: 1, direction: "Any", hideEmptyGenes: false });
    const [ctOpts, setCtOpts] = useState({ minCooccurrence: 1, nPermutations: 1000, fdrAlpha: 0.05, facetTypes: { ff: true, cf: true }, minFacetOccurrence: 1 });
    const [ctInput, setCtInput] = useState("APOE");
    const [ctRes, setCtRes] = useState(null);
    const [ctBusy, setCtBusy] = useState(false);
    const [ctProgress, setCtProgress] = useState(null);
    const [ctError, setCtError] = useState(null);
    const [gmInput, setGmInput] = useState("APOE");
    const [gmRes, setGmRes] = useState(null);
    const [gmOpts, setGmOpts] = useState({ maxCandidates: 150, minCooccurrence: 2, k: 8, minSim: 0.05, resolution: 1, minModuleSize: 3, testSignificance: false, nPermutations: 200 });
    const [gmBusy, setGmBusy] = useState(false);
    const [gmProgress, setGmProgress] = useState(null);
    const [gmError, setGmError] = useState(null);

    const searchSeq = React.useRef(0);
    const fpSeq = React.useRef(0);
    const ctxSeq = React.useRef(0);
    const searchOptsRef = React.useRef(searchOpts);
    const fpOptsRef = React.useRef(fpOpts);
    searchOptsRef.current = searchOpts;
    fpOptsRef.current = fpOpts;

    const runSearch = useCallback(async (text, opts) => {
      const seq = ++searchSeq.current;
      const genes = G.compute.norm((text || "").split(/[\s,;]+/));
      if (!genes.length) {
        if (seq === searchSeq.current) setSearchRes(null);
        return;
      }
      const res = await G.query.enrich(genes, { dir: (opts || searchOptsRef.current).dir });
      if (seq === searchSeq.current) setSearchRes(res);
    }, []);
    const runFingerprint = useCallback(async (text, opts) => {
      const seq = ++fpSeq.current;
      const genes = G.compute.norm((text || "").split(/[\s,;]+/));
      const o = opts || fpOptsRef.current;
      if (!genes.length) {
        if (seq === fpSeq.current) setFpRes(null);
        return;
      }
      const res = await G.query.fingerprint(genes, { dir: o.dir, unit: o.unit, tissues: o.tissues, types: o.types, contrasts: o.contrasts, restrictFf: o.restrictFf, restrictCf: o.restrictCf });
      if (seq === fpSeq.current) setFpRes(res);
    }, []);
    React.useEffect(() => {
      const t = setTimeout(() => runSearch(searchInput, searchOptsRef.current), 220);
      return () => clearTimeout(t);
    }, [searchInput, searchOpts.dir, runSearch]);
    React.useEffect(() => {
      const t = setTimeout(() => runFingerprint(fpInput, fpOptsRef.current), 220);
      return () => clearTimeout(t);
    }, [fpInput, runFingerprint]);
    const runContexts = useCallback(async (text) => {
      const seq = ++ctxSeq.current;
      const genes = G.compute.norm((text || "").split(/[\s,;]+/));
      if (!genes.length) {
        if (seq === ctxSeq.current) setCtxRes(null);
        return;
      }
      try {
        const run = (G.compute && G.compute.contexts)
          ? (g) => G.compute.contexts(g)
          : (G.query && G.query.contexts);
        if (!run) throw new Error("Context Matrix is unavailable. Reload the page to pick up the data layer.");
        const res = await run(genes);
        if (seq === ctxSeq.current) setCtxRes(res);
      } catch (e) {
        if (seq === ctxSeq.current) setCtxRes({ error: e.message || String(e), genes: genes, found: [], rows: [], processes: [] });
      }
    }, []);
    React.useEffect(() => {
      const t = setTimeout(() => runContexts(ctxInput), 220);
      return () => clearTimeout(t);
    }, [ctxInput, runContexts]);
    React.useEffect(() => {
      const t = setTimeout(() => writeUrlState({ tab, view: wbTab, genes: wbGenes, fdr: searchOpts.fdr, dir: searchOpts.dir, facet: searchOpts.facet }), 280);
      return () => clearTimeout(t);
    }, [tab, wbTab, wbGenes, searchOpts.fdr, searchOpts.dir, searchOpts.facet]);
    React.useEffect(() => {
      const onKey = (e) => {
        if (e.key !== "Escape") return;
        setLegendOpen(false);
        setDevOpen(false);
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);
    const runCotravel = useCallback(async (gene, opts) => {
      setCtBusy(true); setCtError(null); setCtProgress({ phase: "starting", frac: 0 });
      try {
        const res = await G.query.cotravelTest(gene, opts, p => setCtProgress(p));
        setCtRes(res);
      } catch (e) {
        setCtError(e.message || String(e)); setCtRes(null);
      } finally {
        setCtBusy(false); setCtProgress(null);
      }
