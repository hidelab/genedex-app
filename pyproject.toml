[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genedex"
version = "1.1.0"
description = "GeneDeX: Gene Set Discovery & Facet Analysis in Alzheimer's Disease"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Giulia Pegoraro" },
  { name = "Sumeet Gupta" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
